<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#13254b">
<title>연결 없음 · 이기성 태권도</title>
<style>
:root{color-scheme:light}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:#f8fafd;color:#13254b;font-family:Pretendard,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;word-break:keep-all}
.box{width:100%;max-width:380px;background:#fff;border:1px solid #e3e9f3;border-radius:22px;padding:30px 24px;text-align:center;box-shadow:0 10px 30px rgba(19,37,75,.06)}
img{width:76px;height:76px;object-fit:contain}
h1{font-size:20px;margin:14px 0 8px}
p{margin:0;color:#5b6b86;font-size:14.5px;line-height:1.6}
button{margin-top:22px;width:100%;border:0;border-radius:14px;padding:14px;background:#1755bc;color:#fff;font-size:16px;font-weight:800;font-family:inherit;cursor:pointer}
</style>
</head>
<body>
<div class="box">
<img src="./icon-192.png" alt="">
<h1>인터넷에 연결되어 있지 않습니다</h1>
<p>관원·출결 정보는 서버에서 불러오기 때문에<br>연결이 돌아오면 다시 열어 주세요.</p>
<button type="button" onclick="location.reload()">다시 시도</button>
</div>
<script>addEventListener('online',()=>location.reload())</script>
</body>
</html>
