<script>
const TKD_LOGO='./assets/logo.png';const KEY='dojang_demo_v1';const initial=()=>({students:[{id:1,name:'김민준',belt:'초록띠',className:'초등 A반',guardian:'김보호',phone:'010-0000-0001',joined:'2026-07-01',att:12,total:16,paid:true,level:12,mission:2,status:'재원',note:'발차기 자신감 향상',linked:true},{id:2,name:'이서연',belt:'파란띠',className:'초등 B반',guardian:'이보호',phone:'010-0000-0002',joined:'2026-06-11',att:15,total:16,paid:true,level:15,mission:3,status:'재원',note:'품새 집중력 향상',linked:true},{id:3,name:'박지훈',belt:'노란띠',className:'유치부',guardian:'박보호',phone:'010-0000-0003',joined:'2026-09-02',att:6,total:16,paid:false,level:5,mission:1,status:'재원',note:'기초 동작 연습 중',linked:false},{id:4,name:'최하린',belt:'빨간띠',className:'초등 B반',guardian:'최보호',phone:'010-0000-0004',joined:'2026-05-01',att:14,total:16,paid:true,level:18,mission:4,status:'재원',note:'승급 준비',linked:true},{id:5,name:'정도윤',belt:'하얀띠',className:'초등 A반',guardian:'정보호',phone:'010-0000-0005',joined:'2026-10-01',att:4,total:8,paid:false,level:2,mission:0,status:'재원',note:'적응 단계',linked:false}],attendance:{},notices:[{id:1,title:'10월 승급심사 안내',body:'심사 일정은 도장에서 개별 안내드립니다.',date:'2026-10-18'}],missions:[{id:1,text:'품새 동작 3개 익히기',done:true},{id:2,text:'수업 시간 배려 행동 실천하기',done:true},{id:3,text:'기본 발차기 연습하기',done:false}],invites:[],reviews:[]});let db;try{db=JSON.parse(localStorage.getItem(KEY))||initial()}catch{db=initial()}let role='owner',page='home',search='',attendanceDraft={},attendanceDate=new Date().toLocaleDateString('sv-SE'),duesMonth=new Date().toISOString().slice(0,7);const AUTH_KEY='tkd_local_auth_v21',ACCOUNT_KEY='tkd_local_accounts_v21';const defaultAccounts=()=>[{id:'owner',name:'관장님',role:'owner',sid:null},{id:'coach',name:'사범님',role:'coach',sid:null},{id:'parent1',name:'김민준 보호자',role:'parent',sid:1},{id:'parent2',name:'이서연 보호자',role:'parent',sid:2},{id:'student1',name:'김민준',role:'student',sid:1},{id:'student2',name:'이서연',role:'student',sid:2}];let accounts;try{accounts=JSON.parse(localStorage.getItem(ACCOUNT_KEY))||defaultAccounts()}catch{accounts=defaultAccounts()}let currentAccount=null;let selectedChildId=null;const MONTH=()=>today().slice(0,7);const paidFor=(x,m=MONTH())=>db.dues?.[m]?.[x.id]??(m===MONTH()&&(!x.paidMonth||x.paidMonth===m)&&!Object.keys(db.dues||{}).some(k=>k!==m&&db.dues[k]?.[x.id]!==undefined)?!!x.paid:false);const saveAccounts=()=>localStorage.setItem(ACCOUNT_KEY,JSON.stringify(accounts));db.dues??={};db.coachInvites??=[];db.promotionHistory??=[];db.growthHistory??=[];const linkedIdsOf=a=>[...new Set((a.childIds||[a.sid]).filter(id=>id!=null).map(Number))];const linkedChildren=()=>currentAccount?[...new Set((currentAccount.childIds||[currentAccount.sid]).filter(id=>id!=null).map(Number))].filter(id=>db.students.some(x=>Number(x.id)===id&&x.status==='재원')):[];const ownChild=()=>{const ids=linkedChildren();return db.students.find(x=>x.id===selectedChildId&&ids.includes(x.id))||db.students.find(x=>ids.includes(x.id));};const $=s=>document.querySelector(s);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const active=()=>db.students.filter(x=>x.status==='재원');const today=()=>new Date().toLocaleDateString('sv-SE');let cloudReady=false, cloudPending=0, cloudUnsub=null, cloudWrite=Promise.resolve();
let tkdServerPayload=null,tkdLastSaveOk=true;
// v7.33: 관원별/날짜별 실시간 작성 상태. 잠금은 75초 임대이며 20초마다 갱신됩니다.
let tkdLocks={},tkdLocksUnsub=null,tkdActiveLockKey=null,tkdLockHeartbeat=null;
const tkdLockSession=Array.from(crypto.getRandomValues(new Uint8Array(16)),x=>x.toString(16).padStart(2,'0')).join('');
const tkdLockKeyStudent=id=>'student_'+String(id||'new');
const tkdLockKeyAttendance=day=>'attendance_'+String(day);
function tkdLockMine(data){return !!(data&&currentAccount&&data.uid===currentAccount.id&&data.session===tkdLockSession&&data.expiresAt>Date.now());}
function tkdLockOther(key){const data=tkdLocks[key];return data&&data.expiresAt>Date.now()&&!tkdLockMine(data)?data:null;}
function tkdLockLabel(key){const d=tkdLockOther(key);return d?`<span class="pill red">${esc(d.name||'다른 사용자')} 작성 중</span>`:'';}
function tkdWatchLocks(){
 if(tkdLocksUnsub){tkdLocksUnsub();tkdLocksUnsub=null;}
 tkdLocks={};if(!['owner','coach'].includes(role)||!currentAccount)return;
 tkdLocksUnsub=firebase.firestore().collection('editLocks').onSnapshot(snap=>{
  const next={};snap.docs.forEach(d=>next[d.id]=d.data());tkdLocks=next;
  if(page==='students'||page==='attendance'){
   // 입력 중인 폼/출결 선택값은 화면 재렌더로 지우지 않습니다.
   if(!tkdActiveLockKey&&!document.querySelector('#modalhost .modal'))render();
  }
 },e=>console.error('작성 상태 조회 실패',e));
}
async function tkdAcquireLock(key){
 if(!['owner','coach'].includes(role)||!currentAccount)return false;
 if(tkdActiveLockKey===key)return true;
 if(tkdActiveLockKey)await tkdReleaseLock();
 const uid=currentAccount.id,name=(currentAccount.name||'사용자')+(role==='owner'?' (관장)':' (사범)');
 const ref=firebase.firestore().doc('editLocks/'+key);
 try{
  await firebase.firestore().runTransaction(async tx=>{
   const snap=await tx.get(ref),data=snap.exists?snap.data():null;
   if(data&&data.expiresAt>Date.now()&&(data.uid!==uid||data.session!==tkdLockSession))throw Error('LOCKED:'+data.name);
   tx.set(ref,{uid,session:tkdLockSession,name,expiresAt:Date.now()+75000,updatedAt:firebase.firestore.FieldValue.serverTimestamp()});
  });
  tkdActiveLockKey=key;
  tkdLocks[key]={uid,session:tkdLockSession,name,expiresAt:Date.now()+75000};
  clearInterval(tkdLockHeartbeat);
  tkdLockHeartbeat=setInterval(async()=>{
   if(tkdActiveLockKey!==key)return;
   try{
    await firebase.firestore().runTransaction(async tx=>{
     const snap=await tx.get(ref);
     if(!snap.exists||(snap.data().uid!==uid||snap.data().session!==tkdLockSession))throw Error('잠금 소유권 상실');
     tx.update(ref,{expiresAt:Date.now()+75000,updatedAt:firebase.firestore.FieldValue.serverTimestamp()});
    });
   }catch(e){console.error('작성 상태 갱신 실패',e);clearInterval(tkdLockHeartbeat);tkdActiveLockKey=null;alert('작성 상태 연결이 끊겼습니다. 저장 전 다시 작업을 시작해 주세요.');}
  },20000);
  return true;
 }catch(e){alert(e.message.startsWith('LOCKED:')?e.message.slice(7)+'님이 작성 중입니다. 잠시 후 다시 시도해 주세요.':'작성 상태를 설정하지 못했습니다: '+e.message);return false;}
}
async function tkdVerifyLock(key){
 if(tkdActiveLockKey!==key){alert('작성 상태가 만료되었습니다. 다시 수정해 주세요.');return false;}
 try{const snap=await firebase.firestore().doc('editLocks/'+key).get();if(snap.exists&&snap.data().uid===currentAccount?.id&&snap.data().session===tkdLockSession&&snap.data().expiresAt>Date.now())return true;}catch(e){console.error(e)}
 alert('작성 상태를 확인하지 못했습니다. 다시 수정해 주세요.');return false;
}
async function tkdReleaseLock(){
 const key=tkdActiveLockKey;tkdActiveLockKey=null;clearInterval(tkdLockHeartbeat);tkdLockHeartbeat=null;
 if(!key||!currentAccount)return;
 const ref=firebase.firestore().doc('editLocks/'+key),uid=currentAccount.id;
 try{await firebase.firestore().runTransaction(async tx=>{const snap=await tx.get(ref);if(snap.exists&&snap.data().uid===uid&&snap.data().session===tkdLockSession)tx.delete(ref);});}catch(e){console.warn('작성 잠금은 만료 시 자동 해제됩니다',e)}
}

// v7.42: 관원별 독립 프로필. 회비/출결/과거 이력은 이 문서에 저장하지 않습니다.
const TKD_PROFILE_FIELDS=['name','className','belt','guardian','phone','joined','status','note','promotionDate','gradeLevel','rankKind','rankLevel','rankAwarded'];
const TKD_PROFILE_COLLECTION='studentProfiles';
let tkdProfileUnsub=null,tkdProfiles=new Map(),tkdProfileLogs=new Map(),tkdProfileMigrationReady=false,tkdProfileSyncing=false;
function tkdPromotionLogEntry(id,old,next,by,eventId){
 const keys=['belt','gradeLevel','promotionDate','rankKind','rankLevel','rankAwarded'];
 const changed=keys.filter(k=>String(old[k]??'')!==String(next[k]??''));
 if(!changed.length)return null;
 const beltChanged=changed.includes('belt'),gradeChanged=changed.includes('gradeLevel');
 const detail=[beltChanged?'띠 변경':'',gradeChanged?'급수 변경':'',changed.includes('rankKind')||changed.includes('rankLevel')?'품·단 변경':'',changed.includes('rankAwarded')?'품·단 취득일 변경':'',changed.includes('promotionDate')?'승급일 변경':''].filter(Boolean).join(' · ');
 return {sid:Number(id),before:String(old.belt||''),after:String(next.belt||''),date:String(next.promotionDate||today()),by:String(by||''),createdAtMs:Date.now(),eventId:eventId||('promotion-'+Date.now()+'-'+Math.random().toString(36).slice(2,12)),beforeGrade:String(old.gradeLevel??''),afterGrade:String(next.gradeLevel??''),detail};
}
const tkdProfileRef=id=>firebase.firestore().doc(TKD_PROFILE_COLLECTION+'/'+String(id));
function tkdProfileFromStudent(x){
 const p={};for(const k of TKD_PROFILE_FIELDS){const v=k==='promotionDate'?(x.lastPromotionDate||x.promotionDate||''):x[k];p[k]=String(v??'');}
 return p;
}
function tkdApplyProfile(x,p){
 if(!x||!p)return x;
 for(const k of TKD_PROFILE_FIELDS){if(typeof p[k]!=='string')continue;
  if(k==='promotionDate'){x.promotionDate=p[k];x.lastPromotionDate=p[k];}
  else if(k==='gradeLevel')x.gradeLevel=p[k]===''?'':Number(p[k]);
  else if(k==='rankLevel')x.rankLevel=Number(p[k]||0);
  else x[k]=p[k];
 }
 return x;
}
function tkdApplyAllProfiles(){
 if(!db||!Array.isArray(db.students))return;
 for(const [id,p] of tkdProfiles){let x=db.students.find(x=>String(x.id)===id);
  if(!x&&role!=='parent'){x={id:Number(id),att:0,total:0,level:0,mission:0,linked:false,paid:false};db.students.push(x);}
  if(x)tkdApplyProfile(x,p);
 }
}
function tkdStopProfiles(){if(tkdProfileUnsub){tkdProfileUnsub();tkdProfileUnsub=null;}tkdProfiles.clear();tkdProfileLogs.clear();tkdProfileMigrationReady=false;}
function tkdWatchProfiles(){
 tkdStopProfiles();if(!currentAccount||!['owner','coach','parent'].includes(role))return;
 if(role==='parent'){
  // 부모는 본인 계정에 연결된 자녀 문서만 조회할 수 있습니다.
  const ids=[...new Set([currentAccount.sid,...(currentAccount.childIds||[])].filter(x=>x!=null).map(String))];
  const unsubs=ids.map(id=>tkdProfileRef(id).onSnapshot(snap=>{
   if(snap.exists){tkdProfiles.set(id,snap.data().profile||{});tkdProfileLogs.set(id,snap.data().promotionLog||[]);}else{tkdProfiles.delete(id);tkdProfileLogs.delete(id);}
   tkdApplyAllProfiles();if(currentAccount)render();
  },e=>console.warn('자녀 프로필 동기화 실패',e)));
  tkdProfileUnsub=()=>unsubs.forEach(f=>f());return;
 }
 tkdProfileUnsub=firebase.firestore().collection(TKD_PROFILE_COLLECTION).onSnapshot(snap=>{
  tkdProfiles=new Map(snap.docs.map(d=>[d.id,d.data().profile||{}]));tkdProfileLogs=new Map(snap.docs.map(d=>[d.id,d.data().promotionLog||[]]));
  tkdApplyAllProfiles();if(currentAccount&&!tkdActiveLockKey)render();
 },e=>console.error('관원별 프로필 동기화 실패',e));
}
async function tkdMigrateProfiles(){
 if(role!=='owner'||!cloudReady||tkdProfileMigrationReady)return;
 const fs=firebase.firestore();
 // 문서가 이미 있으면 절대로 이전 원본으로 덮어쓰지 않습니다.
 for(const x of db.students){
  const ref=tkdProfileRef(x.id);
  await fs.runTransaction(async tx=>{const old=await tx.get(ref);if(!old.exists)tx.set(ref,{id:Number(x.id),profile:tkdProfileFromStudent(x),promotionLog:[],createdAt:firebase.firestore.FieldValue.serverTimestamp(),updatedAt:firebase.firestore.FieldValue.serverTimestamp()});});
 }
 tkdProfileMigrationReady=true;
}
async function tkdDirectCoachStudent(type,id,fields){
 if(role!=='coach'||!currentAccount||firebase.auth().currentUser?.uid!==currentAccount.id)throw Error('사범 로그인 상태가 아닙니다.');
 if(type==='studentUpdate'&&!student(id))throw Error('수정할 관원이 없습니다.');
 const ref=tkdProfileRef(id);
 await firebase.firestore().runTransaction(async tx=>{
  const snap=await tx.get(ref);
  if(type==='studentCreate'){
   if(snap.exists)throw Error('관원 ID가 중복되었습니다. 다시 등록해 주세요.');
   const profile={};for(const k of TKD_PROFILE_FIELDS)profile[k]=String(fields[k]??'');
   if(!profile.name)throw Error('관원 이름을 입력하세요.');
   tx.set(ref,{id:Number(id),profile,promotionLog:[],createdAt:firebase.firestore.FieldValue.serverTimestamp(),updatedAt:firebase.firestore.FieldValue.serverTimestamp()});
  }else{
   if(!snap.exists)throw Error('개별 관원 자료가 아직 준비되지 않았습니다. 관장 계정에서 최초 1회 자료 이전을 진행해야 합니다.');
   const previous=snap.data().profile||{};
   const next={};for(const k of TKD_PROFILE_FIELDS)next[k]=String(previous[k]??'');
   for(const [k,v] of Object.entries(fields))if(TKD_PROFILE_FIELDS.includes(k))next[k]=String(v);
   if(!['재원','퇴관'].includes(next.status))next.status='재원';
   if(!next.name)throw Error('관원 이름은 비울 수 없습니다.');
   const log=tkdPromotionLogEntry(id,previous,next,currentAccount.id);
   const existing=snap.data().promotionLog||[];
   if(log&&existing.length>=100)throw Error('승급 기록 보관 한도에 도달했습니다. 관장님에게 문의하세요.');
   tx.update(ref,{profile:next,...(log?{promotionLog:[...existing,log]}:{}),updatedAt:firebase.firestore.FieldValue.serverTimestamp()});
  }
 });
 const latest=await ref.get();tkdProfiles.set(String(id),latest.data().profile||{});tkdProfileLogs.set(String(id),latest.data().promotionLog||[]);tkdApplyAllProfiles();
}
async function tkdSyncOwnerProfile(id,promotionEventId){
 if(role!=='owner'||!cloudReady)return;
 const x=student(id);if(!x)return;
 const profile=tkdProfileFromStudent(x),ref=tkdProfileRef(id);
 await firebase.firestore().runTransaction(async tx=>{
  const snap=await tx.get(ref);
  if(snap.exists){
   // 관장 수정도 사범과 동일한 관원별 승급 이력에 기록합니다.
   // 승급일을 입력하지 않아도 띠·급수 변경을 기록해야 학부모가 즉시 조회할 수 있습니다.
   const before=snap.data().profile||{};
   const log=tkdPromotionLogEntry(id,before,profile,currentAccount?.id,promotionEventId);
   const existing=snap.data().promotionLog||[];
   if(log&&existing.length>=100)throw Error('승급 기록 보관 한도에 도달했습니다.');
   tx.update(ref,{profile,...(log?{promotionLog:[...existing,log]}:{}),updatedAt:firebase.firestore.FieldValue.serverTimestamp()});
  }else tx.set(ref,{id:Number(id),profile,promotionLog:[],createdAt:firebase.firestore.FieldValue.serverTimestamp(),updatedAt:firebase.firestore.FieldValue.serverTimestamp()});
 });
 const latest=await ref.get();
 tkdProfiles.set(String(id),latest.data().profile||{});
 tkdProfileLogs.set(String(id),latest.data().promotionLog||[]);
}

// v7.8: 관장 데이터와 분리된 최소 권한 조회 자료. 기존 원본 데이터는 변경하지 않습니다.
const tkdCoachFields=['id','name','belt','className','guardian','phone','joined','att','total','level','mission','status','note','linked','daysPerWeek','trainingDays','gradeLevel','rankKind','rankLevel','rankAwarded','promotionDate','lastPromotionDate','birth','gender','school','grade','address'];
const tkdParentFields=['id','name','belt','className','att','total','level','mission','status','note','daysPerWeek','trainingDays','rankKind','rankLevel','gradeLevel','rankAwarded','joined','lastPromotionDate','promotionDate','paid','paidMonth','dueDay','dueDate'];
function tkdPick(obj,keys){const result={};for(const k of keys)if(obj&&Object.prototype.hasOwnProperty.call(obj,k))result[k]=obj[k];return result;}
function tkdAttendanceFor(ids){const allowed=new Set(ids.map(String)),result={};for(const [day,entries] of Object.entries(db.attendance||{})){const row={};for(const [id,value] of Object.entries(entries||{}))if(allowed.has(String(id)))row[id]=value;if(Object.keys(row).length)result[day]=row;}return result;}
function tkdDuesFor(ids){const allowed=new Set(ids.map(String)),result={};for(const [month,entries] of Object.entries(db.dues||{})){const row={};for(const [id,value] of Object.entries(entries||{}))if(allowed.has(String(id)))row[id]=value;if(Object.keys(row).length)result[month]=row;}return result;}
function tkdAttendanceForSource(source,ids){const allowed=new Set(ids.map(String)),result={};for(const [day,entries] of Object.entries(source.attendance||{})){const row={};for(const [id,value] of Object.entries(entries||{}))if(allowed.has(String(id)))row[id]=value;if(Object.keys(row).length)result[day]=row;}return result;}
function tkdDuesForSource(source,ids){const allowed=new Set(ids.map(String)),result={};for(const [month,entries] of Object.entries(source.dues||{})){const row={};for(const [id,value] of Object.entries(entries||{}))if(allowed.has(String(id)))row[id]=value;if(Object.keys(row).length)result[month]=row;}return result;}
function tkdRelated(arr,ids){const allowed=new Set(ids.map(Number));return (arr||[]).filter(x=>allowed.has(Number(x.sid)));}
let tkdProjectionQueue=Promise.resolve();
function tkdPublishRoleViews(){
 if(role!=='owner'||!cloudReady)return Promise.resolve();
 tkdProjectionQueue=tkdProjectionQueue.catch(e=>console.error('이전 역할별 동기화 오류',e)).then(async()=>{
  if(role!=='owner'||!cloudReady)return;
  const fs=firebase.firestore();
  const main=await fs.doc('academyData/main').get();

async function tkdOwnerApplyCoachChange(ref){
 if(role!=='owner'||!cloudReady)return;
 // 기존 관장 저장 작업이 완료된 다음 원본을 트랜잭션으로 수정합니다.
 await cloudWrite.catch(()=>{});
 const fs=firebase.firestore(),mainRef=fs.doc('academyData/main');
 try{
  const result=await fs.runTransaction(async tx=>{
   const [req,main]=await Promise.all([tx.get(ref),tx.get(mainRef)]);
   if(!req.exists||req.data().status!=='pending')return null;
   const c=req.data(),source=main.exists?JSON.parse(main.data().payload||'{}'):null;
   if(!source||!Array.isArray(source.students))throw Error('관장 원본 자료가 없습니다.');
   const index=source.students.findIndex(x=>Number(x.id)===Number(c.studentId));
   const allowed=['name','className','belt','guardian','phone','joined','status','note','promotionDate','gradeLevel','rankKind','rankLevel','rankAwarded'];
   const fields={};for(const [key,val] of Object.entries(c.fields||{}))if(allowed.includes(key)&&typeof val==='string')fields[key]=val;
   let problem='';
   if(c.type==='studentCreate'){
    if(index>=0)problem='관원 ID 중복';
    else if(!fields.name)problem='이름 누락';
    else source.students.push({id:c.studentId,att:0,total:0,level:0,mission:0,linked:false,paid:false,...fields});
   }else if(c.type==='studentUpdate'){
    if(index<0)problem='수정할 관원이 없습니다.';
    else{
     const x=source.students[index],before=x.belt||'',oldDate=x.lastPromotionDate||'';
     const beltChanged=fields.belt!==undefined&&before!==fields.belt;
     const dateChanged=!!fields.promotionDate&&oldDate!==fields.promotionDate,rankChanged=(fields.rankLevel!==undefined&&Number(x.rankLevel||0)!==Number(fields.rankLevel||0))||(fields.rankKind!==undefined&&String(x.rankKind||'품')!==String(fields.rankKind||'품')),gradeChanged=fields.gradeLevel!==undefined&&String(x.gradeLevel??'')!==String(fields.gradeLevel),awardChanged=fields.rankAwarded!==undefined&&String(x.rankAwarded||'')!==String(fields.rankAwarded);      if(beltChanged||dateChanged||rankChanged||gradeChanged||awardChanged){source.promotionHistory??=[];source.promotionHistory.push({sid:x.id,before,after:fields.belt||before,date:fields.promotionDate||oldDate||new Date().toISOString().slice(0,10),by:c.uid,createdAtMs:Date.now(),beforeGrade:String(x.gradeLevel??''),afterGrade:String(fields.gradeLevel??x.gradeLevel??''),detail:[beltChanged?'띠 변경':'',gradeChanged?'급수 변경':'',rankChanged?'품·단 변경':'',awardChanged?'품·단 취득일 변경':'',dateChanged?'승급일 변경':''].filter(Boolean).join(' · ')});}
     Object.assign(x,fields);
     if(fields.promotionDate)x.lastPromotionDate=fields.promotionDate;
     if(fields.gradeLevel!==undefined)x.gradeLevel=fields.gradeLevel===''?'':Number(fields.gradeLevel);
     if(fields.rankLevel!==undefined)x.rankLevel=Number(fields.rankLevel||0);
    }
   }else if(c.type==='attendance'){
    if(index<0)problem='출결 대상 관원이 없습니다.';
    else if(source.students[index].status!=='재원')problem='퇴관 관원은 출결을 수정할 수 없습니다.';
    else{
     source.attendance??={};source.attendance[c.day]??={};
     if(c.value==='unrecorded')delete source.attendance[c.day][c.studentId];
     else source.attendance[c.day][c.studentId]=c.value==='present';
     source.attendanceFinalized??={};delete source.attendanceFinalized[c.day];
    }
   }else problem='지원하지 않는 요청 유형';
   if(problem){tx.update(ref,{status:'rejected',reason:problem,processedAt:firebase.firestore.FieldValue.serverTimestamp()});return {rejected:true};}
   tx.set(mainRef,{payload:JSON.stringify(source),updatedAt:firebase.firestore.FieldValue.serverTimestamp()});
   tx.update(ref,{status:'applied',processedAt:firebase.firestore.FieldValue.serverTimestamp()});
   return {applied:true};
  });
  if(result?.applied){console.info('사범 변경 반영 완료',ref.id);await tkdPublishRoleViews();}
 }catch(e){console.error('사범 변경 반영 실패 (요청 유지)',ref.id,e);}
}

async function tkdSyncOwnerProfileDiffs(changes){

  const ref=tkdProfileRef(item.id);
  await firebase.firestore().runTransaction(async tx=>{

   if(!snap.exists)throw Error('관원별 자료가 없어 저장을 중단했습니다: '+item.id);
   const old=snap.data().profile||{};
   for(const [k,v] of Object.entries(item.changes)){
    if(String(old[k]??'')!==String(item.baseline[k]??''))throw Error('사범이 동일 항목을 먼저 수정했습니다. 새로고침 후 다시 시도하세요.');
   }
   const next={...old,...item.changes};
   const log=tkdPromotionLogEntry(item.id,old,next,currentAccount.id);
   const existing=snap.data().promotionLog||[];
   if(log&&existing.length>=100)throw Error('승급 기록 보관 한도에 도달했습니다: '+item.id);
   tx.update(ref,{profile:next,...(log?{promotionLog:[...existing,log]}:{}),updatedAt:firebase.firestore.FieldValue.serverTimestamp()});
  });
  tkdProfiles.set(String(item.id),{...(tkdProfiles.get(String(item.id))||{}),...item.changes});
 }
}

function stepStudentField(button,name,direction){
 const field=button.closest('.tkd-step-wrap').querySelector('[name="'+name+'"]');if(!field)return;
 const current=Number(field.value)||0;
 if(name==='gradeLevel')field.value=String(Math.max(1,Math.min(99,(current||1)-direction)));
 else field.value=String(Math.max(0,Math.min(9,current+direction)));

function tkdToggleRankAwarded(form){const level=form?.elements?.rankLevel,date=form?.elements?.rankAwarded;if(!level||!date)return;date.disabled=!(Number(level.value)>0);if(date.disabled)date.value='';}
function formatRank(x){return Number(x.rankLevel)>0?String(x.rankLevel)+(x.rankKind==='단'?'단':'품'):'미취득'}
function bulkNext(x,grade,rank,gradeDelta,rankDelta){
 const next={gradeLevel:x.gradeLevel,rankLevel:Number(x.rankLevel)||0,rankKind:x.rankKind||'품'};
 if(grade!=='keep')next.gradeLevel=grade==='clear'?'':Number(grade);
 if(rank!=='keep'){if(rank==='0'){next.rankLevel=0;next.rankKind='품'}else{const [n,k]=rank.split('-');next.rankLevel=Number(n);next.rankKind=k}}
 if(gradeDelta){const old=Number(next.gradeLevel);if(!old)return {error:'급수 미입력'};if(old-gradeDelta<1||old-gradeDelta>99)return {error:'급수 범위 초과'};next.gradeLevel=old-gradeDelta}
 if(rankDelta){const old=Number(next.rankLevel)||0;if(old+rankDelta<0||old+rankDelta>9)return {error:'품·단 범위 초과'};if(next.rankKind==='품'&&old+rankDelta>4)return {error:'4품 초과는 개별 확인 필요'};next.rankLevel=old+rankDelta}

}

}

  if(existing.empty)return code;
 }

async function tkdDeleteParentRequest(uid){
 if(role!=='owner'||!cloudReady)return;
 const fs=firebase.firestore();
 try{
  const ref=fs.doc('registrationRequests/'+uid);
  const snap=await ref.get();
  if(!snap.exists||!['parent','coach'].includes(snap.data().role))return alert('삭제할 가입 신청 내역을 찾을 수 없습니다.');
  const a=snap.data();
  const approved=a.status==='approved';
  const memberRole=a.role==='coach'?'사범':'학부모';
  const msg=approved
   ?`${a.name||memberRole}님의 승인 내역을 삭제하시겠습니까?\\n해당 ${memberRole} 계정의 앱 이용 권한도 해제됩니다. 기존 관원·출결·회비 데이터는 삭제되지 않습니다.`
   :`${a.name||memberRole}님의 ${a.status==='pending'?'승인 대기':'반려'} 신청 내역을 삭제하시겠습니까?`;
  if(!confirm(msg.replace(/\\n/g,'\\n')))return;
  await fs.runTransaction(async tx=>{
   const req=await tx.get(ref);
   if(!req.exists||!['parent','coach'].includes(req.data().role))throw Error('가입 신청 내역이 변경되었습니다.');
   const status=req.data().status;
   const userRef=fs.doc('users/'+uid);
   const userSnap=status==='approved'?await tx.get(userRef):null;
   if(status==='approved'&&userSnap?.exists){
    if(userSnap.data().role!==req.data().role)throw Error('계정 역할이 일치하지 않아 삭제를 중단했습니다.');
    tx.update(userRef,{active:false});
   }
   tx.delete(ref);
  });
  toast('가입 신청 내역이 삭제되었습니다.');
  await tkdRefreshApprovals();
 }catch(e){alert('삭제 실패: '+e.message)}
}
async function tkdStartRecovery(uid){
 if(role!=='owner'||!cloudReady||!firebase.auth().currentUser)return;
 const fs=firebase.firestore(),userRef=fs.doc('users/'+uid);
 try{
  const userSnap=await userRef.get();
  if(!userSnap.exists)throw Error('기존 승인 계정을 찾을 수 없습니다.');
  const a=userSnap.data();
  if(!['parent','coach'].includes(a.role))throw Error('복구 대상이 아닙니다.');
  if(a.active!==true){alert('이 계정은 이미 비활성화되어 있습니다. 중복 복구를 진행하지 마세요.');return;}
  const sid=a.role==='parent'?Number(a.sid):null;
  const child=a.role==='parent'?student(sid):null;
  if(a.role==='parent'&&(!child||!Number.isSafeInteger(sid)||sid<=0))throw Error('자녀 연결을 확인할 수 없습니다.');
  const msg=`${a.name||'회원'}님의 기기 변경 복구를 진행하시겠습니까?\n\n기존 기기 계정은 즉시 접근이 차단됩니다. 새 기기에서 초대코드로 다시 가입한 뒤 관장님이 새 가입 신청을 승인해야 합니다.\n\n기존 관원·출결·회비 데이터는 삭제되지 않습니다.`;
  if(!confirm(msg))return;
  const code=await tkdNewEightDigitInviteCode(fs);
  const expiresAt=firebase.firestore.Timestamp.fromMillis(Date.now()+7*86400000);
  const invitationRef=fs.collection('invitations').doc();
  const batch=fs.batch();
  batch.set(invitationRef,{code,role:a.role,sid:sid,childName:child?child.name:'',recoveryFromUid:uid,recoveryFromName:a.name||'',used:false,createdAt:firebase.firestore.FieldValue.serverTimestamp(),expiresAt});
  batch.update(userRef,{active:false,recoveryRequestedAt:firebase.firestore.FieldValue.serverTimestamp()});
  await batch.commit();
  const message=`[경희 이기성 태권도] 기기 변경 계정 복구 안내\n\n앱 주소: ${location.origin+location.pathname}\n새 초대코드: ${code}\n유효기간: 7일\n\n새 기기에서 ${a.role==='parent'?'학부모':'사범님'} 모드를 선택하고 '초대코드로 처음 등록하기'를 누르세요. 새 암호를 설정해 가입 신청한 뒤 관장님의 승인을 받아야 합니다. 기존 계정은 접근이 중지되었습니다.`;
  modal(`<h2>계정 복구 초대코드 발급 완료</h2><p>기존 계정은 비활성화되었습니다. 새 계정 가입과 승인 전까지 해당 회원은 로그인할 수 없습니다.</p><div class="card" style="overflow-wrap:anywhere">${esc(code)}</div><textarea id="inviteSmsMessage" class="field" rows="10" readonly style="width:100%">${esc(message)}</textarea><div class="row">${btn('안내문구 전체 복사','copyInviteMessage()')}${btn('닫기','closeModal()','ghost')}</div>`);
  tkdRefreshApprovals();
 }catch(e){alert('계정 복구 초대 발급 실패: '+e.message);}
}
async function tkdApprove(uid){
 if(role!=='owner'||!cloudReady)return;
 const fs=firebase.firestore();
 try{
  const reqRef=fs.doc('registrationRequests/'+uid),req=await reqRef.get();
  if(!req.exists||req.data().status!=='pending')throw Error('승인 대기 신청이 아닙니다.');
  const a=req.data();
  const matches=await fs.collection('invitations').where('code','==',a.inviteCode).get();
  const invitation=matches.docs.find(d=>d.data().role===a.role&&!d.data().used&&d.data().expiresAt?.toMillis()>Date.now()&&(a.role!=='parent'||(Number(d.data().sid)>0&&d.data().childName===a.childName)));
  if(!invitation)throw Error('초대코드가 없거나 만료·사용 완료되었거나 자녀 이름이 일치하지 않습니다.');
  if(!confirm(`${a.name} (${a.role==='parent'?'학부모':'사범'}) 가입을 승인하시겠습니까?`))return;
  await fs.runTransaction(async tx=>{
   const [rr,ir]=await Promise.all([tx.get(reqRef),tx.get(invitation.ref)]);
   const previousUid=ir.data()?.recoveryFromUid;
   const oldRef=previousUid?fs.doc('registrationRequests/'+previousUid):null;
   const oldUserRef=previousUid?fs.doc('users/'+previousUid):null;
   const [oldReq,oldUser]=oldRef?await Promise.all([tx.get(oldRef),tx.get(oldUserRef)]):[null,null];
   if(rr.data()?.status!=='pending'||ir.data()?.used||ir.data()?.expiresAt?.toMillis()<=Date.now())throw Error('신청 또는 초대코드 상태가 변경되었습니다.');
   tx.set(fs.doc('users/'+uid),{role:a.role,active:true,name:a.name,sid:a.role==='parent'?ir.data().sid:null,...(a.role==='parent'?{childIds:[...new Set([ir.data().sid,...(Array.isArray(oldUser?.data()?.childIds)?oldUser.data().childIds:[])].filter(v=>v!=null).map(Number))]}:{}),approvedAt:firebase.firestore.FieldValue.serverTimestamp()});
   tx.update(reqRef,{status:'approved',approvedAt:firebase.firestore.FieldValue.serverTimestamp()});
   tx.update(invitation.ref,{used:true,usedBy:uid});
   if(oldRef){
    if(previousUid===uid||!oldReq?.exists||!oldUser?.exists||oldUser.data().active!==false||oldUser.data().role!==a.role||oldReq.data().role!==a.role||oldReq.data().status!=='approved')throw Error('기존 복구 대상 계정 상태를 확인할 수 없습니다.');
    tx.update(oldUserRef,{active:false,recoveryCompletedAt:firebase.firestore.FieldValue.serverTimestamp(),replacedByUid:uid});
    tx.update(oldRef,{status:'recovered',previousName:oldUser.data().name||oldReq.data().name||'',previousRole:oldUser.data().role,recoveredBy:uid,recoveredByName:a.name,recoveredAt:firebase.firestore.FieldValue.serverTimestamp()});
   }
  });
  await tkdPublishRoleViews();toast('가입 승인 완료');tkdRefreshApprovals();
 }catch(e){alert('승인 실패: '+e.message)}
}

 if(role!=='owner'||!cloudReady||!confirm('가입 신청을 반려하시겠습니까?'))return;

async function tkdRegisterInvite(e){
 e.preventDefault();const f=new FormData(e.target);
 if(f.get('pin')!==f.get('pinConfirm'))return alert('암호가 일치하지 않습니다.');
 const type=String(f.get('role')),name=String(f.get('name')||'').trim(),childName=String(f.get('childName')||'').trim(),code=String(f.get('inviteCode')||'').trim().toUpperCase();
 if(!['parent','coach'].includes(type)||!name||!code||(type==='parent'&&!childName))return alert('필수 항목을 확인하세요.');
 if(!crypto.randomUUID)return alert('보안 기능을 지원하지 않는 브라우저입니다.');
 const id=crypto.randomUUID().replace(/-/g,'');const email='member-'+id+'@lkstkd.invalid';
 const button=e.target.querySelector('[type=submit]');button.disabled=true;
 try{
  await firebase.auth().setPersistence(firebase.auth.Auth.Persistence.SESSION);
  const credential=await firebase.auth().createUserWithEmailAndPassword(email,String(f.get('pin')));
  
  await firebase.firestore().doc('registrationRequests/'+credential.user.uid).set({uid:credential.user.uid,role:type,name,childName:type==='parent'?childName:'',inviteCode:code,status:'pending',createdAt:firebase.firestore.FieldValue.serverTimestamp()});
  tkdRememberMember({email,role:type,name,childNames:type==='parent'?[childName]:[],uid:credential.user.uid});
  await firebase.auth().signOut();tkdLoginRole=type;alert('가입 신청이 접수되었습니다. 관장님 승인 후 로그인할 수 있습니다.');showAuth();
 }catch(err){alert('가입 신청 실패: '+err.message);button.disabled=false;}
}

function showAuth(){
 currentAccount=null;document.body.classList.add('tkd-auth-pending');

async function firebaseOwnerLogin(e){

 try{await firebase.auth().signInWithEmailAndPassword(String(f.get('email')).trim(),String(f.get('password')));}
