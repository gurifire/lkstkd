/* v2.9: Mobile login viewport fit and edge-to-edge only; no changes to app pages or logic. */
@media (max-width:690px){
 html,body{width:100%;margin:0}
 #authroot:not(:empty){position:fixed;inset:0;width:100%;height:100dvh;max-width:none;margin:0;padding:0;overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;background:#fff;z-index:200}
 #authroot .authpanel.branded-auth.auth-login-view{
  width:100%;max-width:none;min-height:100dvh;height:auto;margin:0;border:0;border-radius:0;box-shadow:none;
  padding:clamp(12px,2.3dvh,22px) clamp(17px,5vw,25px) max(8px,env(safe-area-inset-bottom));
  display:flex;flex-direction:column;justify-content:center;
 }
 #authroot .auth-login-view .login-logo{width:clamp(90px,17dvh,142px);height:clamp(90px,17dvh,142px);margin:0 auto clamp(5px,1.2dvh,12px)}
 #authroot .auth-login-view h1{font-size:clamp(23px,6.6vw,33px);line-height:1.2;margin:0 0 clamp(10px,2.5dvh,22px)}
 #authroot .auth-login-view .auth-input-wrap{margin-bottom:clamp(7px,1.25dvh,11px)}
 #authroot .auth-login-view .auth-input-wrap .field{height:clamp(42px,7dvh,53px);font-size:14px}
 #authroot .auth-login-view .auth-options{margin:clamp(5px,1dvh,9px) 0 clamp(8px,1.4dvh,12px);font-size:12px}
 #authroot .auth-login-view .demo-login-fields .auth-login-button{height:clamp(43px,7dvh,53px);font-size:18px}
 #authroot .auth-login-view .auth-divider{margin:clamp(8px,1.6dvh,15px) 4px}
 #authroot .auth-login-view .auth-google{height:clamp(43px,7dvh,53px);font-size:15px}
 #authroot .auth-login-view .auth-signup{margin:clamp(8px,1.7dvh,15px) 0 0;font-size:13px}
 #authroot .auth-login-view .auth-test-panel{margin:clamp(9px,2dvh,17px) 0 0;padding:7px 9px;font-size:12px}
 #authroot .auth-login-view .auth-test-panel:not([open]){background:#fff;border-color:#e5eaf3}
 #authroot .auth-login-view .auth-test-panel[open]{flex-shrink:0}
 #authroot .auth-login-view{background-size:min(60%,240px) auto,min(59%,240px) auto,min(30%,130px) auto}
}
@media(max-width:690px) and (max-height:650px){
 #authroot .authpanel.branded-auth.auth-login-view{justify-content:flex-start;padding-top:9px;padding-bottom:8px}
 #authroot .auth-login-view .login-logo{width:clamp(80px,15dvh,105px);height:clamp(80px,15dvh,105px)}
 #authroot .auth-login-view h1{margin-bottom:8px;font-size:clamp(21px,6vw,28px)}
 #authroot .auth-login-view .auth-input-wrap .field{height:42px}
 #authroot .auth-login-view .demo-login-fields .auth-login-button,#authroot .auth-login-view .auth-google{height:42px}
 #authroot .auth-login-view .auth-divider{margin:7px 4px}
 #authroot .auth-login-view .auth-test-panel{margin-top:8px}
}

};const student=id=>db.students.find(x=>x.id===+id);const percent=x=>Math.round(100*x.att/Math.max(1,x.total));const icon={home:'🏠',students:'👥',attendance:'📅',dues:'💳',promotions:'🏆',growth:'🌱',notices:'📣',invites:'🔗',approvals:'🛡️',stats:'📊',settings:'⚙️',missions:'⭐'};const labels={home:'오늘의 도장',students:'관원 관리',attendance:'출결 관리',dues:'회비 관리',promotions:'승급심사',growth:'성장 기록',notices:'공지사항',invites:'학부모 초대',approvals:'가입 승인 관리',stats:'운영 통계',settings:'설정',missions:'성장 미션',parentAttendance:'자녀 출석 내역',parentDues:'자녀 회비 내역',parentNews:'최근 성장 소식'};const menus=()=>role==='owner'?['home','students','attendance','dues','promotions','growth','notices','invites','approvals','stats','settings']:role==='coach'?['home','students','attendance','promotions','growth','notices']:role==='parent'?['home','growth','notices','parentAttendance','parentDues','parentNews']:['home','missions','growth','notices'];const btn=(t,fn,cls='secondary')=>`<button class="btn ${cls}" onclick="${fn}">${t}</button>`;function toast(t){$('#toasthost').innerHTML=`<div class="toast">${esc(t)}</div>`;setTimeout(()=>$('#toasthost').innerHTML='',2600)}function navigate(p){if(!menus().includes(p))return;if(page!==p)history.pushState({tkdPage:p,tkdRole:role},'','#'+p);if(page==='attendance'&&p!=='attendance')attendanceDraft={};page=p;search='';render()}function render(){finalizeDue();if(!currentAccount){showAuth();return;}document.body.classList.remove("tkd-auth-pending");document.querySelector('#currentuser').textContent=currentAccount.name+' · '+({owner:'관장',coach:'사범',parent:'학부모',student:'관원'}[role]);if(!menus().includes(page))page='home';$('#pagetitle').innerHTML=(role==='owner'&&page==='home')?'<span style="color:#1755bc">경희</span> 이기성 <span style="color:#d92838">태권도</span>':role==='parent'?(page==='parentAttendance'||page==='parentDues'?labels[page]:'우리 아이의 태권도'):role==='student'?'나의 태권도 성장':labels[page];document.querySelector('.eyebrow').innerHTML=(role==='owner'&&page==='home')?'':`<span style="colo const localDate=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');
const dateObj=d=>new Date(d+'T12:00:00');

// 공휴일 계산: 실행 환경의 ICU 음력 달력 + 고정 공휴일. 연도 제한 없음.
// 임시공휴일 및 미래 법령 개정은 자동 수신되지 않으므로 관장 휴관일 설정으로 보완.
const HOLIDAY_CACHE={};
const LUNAR_FORMAT=new Intl.DateTimeFormat('en-u-ca-chinese',{month:'numeric',day:'numeric',year:'numeric',timeZone:'Asia/Seoul'});
const asDate=(y,m,d)=>new Date(Date.UTC(y,m-1,d,3));
const dateKeyUTC=d=>d.toISOString().slice(0,10);
const addUTC=(d,n)=>new Date(d.getTime()+n*86400000);
const lunarParts=d=>{const a=Object.fromEntries(LUNAR_FORMAT.formatToParts(d).map(p=>[p.type,p.value]));return {year:Number(a.relatedYear),month:Number(a.month),day:Number(a.day),leap:/bis|leap|윤/i.test(a.month)}};
function holidaysForYear(year){
 if(HOLIDAY_CACHE[year])return HOLIDAY_CACHE[year];
 const found={},original=new Set(),substitutes=[];
 const add=(d,name,rule)=>{const k=dateKeyUTC(d);(found[k]??=[]).push({name,rule});original.add(k)};
 const fixed=[[1,1,'신정','none'],[3,1,'삼일절','weekend'],[5,1,'노동절','weekend'],[5,5,'어린이날','weekend'],[6,6,'현충일','none'],[8,15,'광복절','weekend'],[10,3,'개천절','weekend'],[10,9,'한글날','weekend'],[12,25,'성탄절','weekend']];
 for(const [m,d,name,rule] of fixed){if(name==='노동절'&&year<2026)continue;add(asDate(year,m,d),name,rule)}
 if(year>=2026)add(asDate(year,7,17),'제헌절','weekend');
 // 전년도 말부터 다음해 초까지 검사하여 음력 설 연휴의 연도 경계를 안전하게 처리.
 for(let d=asDate(year-1,12,1),last=asDate(year+1,1,31);d<=last;d=addUTC(d,1)){
   const p=lunarParts(d);
   if(p.leap)continue;
   if(p.month===1&&p.day===1){for(const [off,label] of [[-1,'설날 전날'],[0,'설날'],[1,'설날 다음날']]){const x=addUTC(d,off);if(x.getUTCFullYear()===year)add(x,label,'seollal')}}
   if(p.month===8&&p.day===15){for(const [off,label] of [[-1,'추석 전날'],[0,'추석'],[1,'추석 다음날']]){const x=addUTC(d,off);if(x.getUTCFullYear()===year)add(x,label,'chuseok')}}
   if(p.month===4&&p.day===8&&d.getUTCFullYear()===year)add(d,'부처님오신날','weekend');
 }
 // 같은 날 겹치는 공휴일 및 일요일(일부는 토요일도)에 대체휴일 지정.
 // 연휴 단위 중복 대체 지정 방지를 위해 연휴별로 한 번만 대체휴일 산정.
 const grouped={};
 for(const [k,items] of Object.entries(found)){
   for(const item of items){
     const group=item.rule==='seollal'||item.rule==='chuseok'?item.rule+'-'+year:item.name+'-'+year;
     (grouped[group]??=[]).push({date:k,rule:item.rule,name:item.name,overlap:items.length>1});
   }
 }
 for(const group of Object.values(grouped)){
   const trigger=group.some(o=>{
     const dow=asDate(...o.date.split('-').map(Number)).getUTCDay();
     return o.rule==='weekend'?(dow===0||dow===6||o.overlap):
       (o.rule==='seollal'||o.rule==='chuseok')?(dow===0||o.overlap):false;
   });
   if(!trigger)continue;
   const last=group.map(o=>o.date).sort().at(-1);
   let next=addUTC(asDate(...last.split('-').map(Number)),1);
   while(next.getUTCDay()===0||next.getUTCDay()===6||original.has(dateKeyUTC(next))||substitutes.some(x=>x.date===dateKeyUTC(next)))next=addUTC(next,1);
   if(next.getUTCFullYear()===year)substitutes.push({date:dateKeyUTC(next),name:group[0].name+' 대체공휴일'});
 }
 const out=Object.fromEntries(Object.entries(found).map(([k,items])=>[k,items.map(o=>o.name).join('·')]));
 for(const x of substitutes)out[x.date]=out[x.date]?(out[x.date]+'·'+x.name):x.name;
 // 변동 공휴일: 이미 확정된 과거/현재 선거일 등만 포함
 if(year===2026)out['2026-06-03']='전국동시지방선거일';
 HOLIDAY_CACHE[year]=out;return out;
}

const isClassDay=(x,day)=>day>=(x.joined||'0000-00-00')&&schedule(x).includes(dateObj(day).getDay())&&!db.closedDays[day]&&!holidayExcluded(day);
const isFinalizable=day=>{let n=new Date();return day<localDate(n)||(day===localDate(n)&&(n.getHours()>20||(n.getHours()===20&&n.getMinutes()>=40)))};
const attendanceStatus=(day,id)=>db.attendance[day]?.[id]===true?'present':db.attendance[day]?.[id]===false?'absent':(db.attendance[day]?.[id]||'unrecorded');

// 월별 출석률: 해당 월에 출석·결석으로 저장된 기록만 집계한다. 미기록은 제외한다.
function monthlyAttendanceRate(x,year,month){
 const prefix=year+'-'+String(month).padStart(2,'0')+'-';
 let present=0,absent=0;
 for(const [day,records] of Object.entries(db.attendance||{})){
  if(!day.startsWith(prefix)||day>today()||day<(x.joined||'0000-00-00')||!isClassDay(x,day))continue;
  const status=attendanceStatus(day,x.id);
  if(status==='present')present++;
  else if(status==='absent')absent++;
 }
 return present+absent?Math.round(present*100/(present+absent))+'%':'-';
}

function absenceCounts(x){let end=today(),d=end.slice(0,7)+'-01',weekStart=dateObj(end);weekStart.setDate(weekStart.getDate()-(weekStart.getDay()+6)%7);let week=0,month=0;for(;d<=end;d=dateAdd(d,1)){if(!isClassDay(x,d)||!isFinalizable(d)||attendanceStatus(d,x.id)!=='absent')continue;month++;if(d>=localDate(weekStart))week++}return {week,month,limit:x.daysPerWeek==='3'?4:6}}

esc(dueDateFor(x,duesMonth))}" onchange="updateDueDate(${x.id},this.value)" style="min-width:145px"></td><td><span class="pill ${paidFor(x,duesMonth)?'green':'red'}">${paidFor(x,duesMonth)?'납부 완료':'미납'}</span></td><td>${btn(paidFor(x,duesMonth)?'미납으로 변경':'납부 확인',`togglePaid(${x.id})`,'sm secondary')}</td></tr>`).join('')}</tbody></table></div></div>`;if(page==='promotions')return `<div class="card">${head('승급·승품(단) 예정일 관리','관원 관리에서 승급·품단 정보를 입력합니다. 이 화면은 예정일 확인 전용입니다.')}<div class="tablewrap"><table><thead><tr><th>관원</th><th>현재 띠</th><th>품(단)</th><th>현 급수</th><th>최근 품·단 취득일</th><th>승급 예정일</th><th>승품(단) 예정일</th></tr></thead><tbody>${list.map(x=>`<tr><td><b>${esc(x.name)}</b> <span class="muted mini">(${esc(x.className)})</span></td><td>${esc(x.belt)}</td><td>${Number(x.rankLevel)>0?esc(String(x.rankLevel)+(x.rankKind==='단'?'단':'품')):'미취득'}</td><td>${x.gradeLevel?esc(String(x.gradeLevel)+'급'):'미입력'}</td><td>${['하얀띠','노란띠','주황띠','보라띠','초록띠','파란띠','밤띠','빨간띠'].includes(x.belt)?'해당없음':esc(x.rankAwarded||'미입력')}</td><td>${esc(nextGradeDate(x))}</td><td>${esc(nextRankDate(x))}</td></tr>`).join('')}</tbody></table></div><p class="muted mini">예정일은 수련기간 기준 참고 날짜입니다. 실제 국기원 응시자격에는 연령·품단 전환·심사 일정 등의 추가 조건이 적용됩니다.</p></div>`;if(page==='growth')return `<div class="card">${head('관원별 성장 기록','지도자가 관찰한 내용을 간단히 기록합니다.')}<div class="stack">${list.map(x=>`<div class="notice split"><div><b>${esc(x.name)} <span class="pill">${esc(x.belt)}</span></b><p>${esc(x.note||'성장 기록 없음')}</p></div>${btn('기록 수정',`openGrowth(${x.id})`,'sm secondary')}</div>`).join('')}</div></div>`;if(page==='notices')return noticesView(true);if(page==='approvals')return tkdApprovalView();if(page==='invites')return tkdInvitesView();if(page==='stats')return `<div class="grid metrics">${metric('👥',list.length,'재원 관원')}${metric('💳',list.filter(x=>paidFor(x)).length,'회비 납부')}${metric('⚠️',list.filter(x=>percent(x)<65).length,'출석 관심')}${metric('🔗',list.filter(x=>x.linked).length,'학부모 연결')}</div><div class="card">${head('관원별 출석률',`${today().slice(0,4)}년 월별 출결기록 기준`)}<div class="tablewrap tkd-stats-scroll"><table><thead><tr><th>관원 이름(수련반)</th>${Array.from({length:12},(_,i)=>`<th>${i+1}월</th>`).join('')}</tr></thead><tbody>${list.map(x=>`<tr><td><b>${esc(x.name)}</b> (${esc(x.className)})</td>${Array.from({length:12},(_,i)=>`<td>${monthlyAttendanceRate(x,today().slice(0,4),i+1)}</td>`).join('')}</tr>`).join('')}</tbody></table>${!list.length?'<div class="empty">재원 관원이 없습니다.</div>':''}</div></div>`;if(page==='settings')return `<div class="card">${head('테스트 데이터 설정')}<div class="row">${btn('데이터 JSON 내보내기','exportData()')}${btn('초기 예시 데이터로 복원','resetData()','danger')}</div></div>`;return ''}
function studentTable(list){return `<table><thead><tr><th><input type="checkbox" aria-label="관원 전체 선택" onchange="bulkSelectAll(this.checked)"></th><th>관원</th><th>띠</th><th>품(단)</th><th>현 급수</th><th>수련반</th><th>출석률</th><th>상태</th><th>관리</th></tr></thead><tbody>${list.map(x=>`<tr><td><input type="checkbox" class="bulk-student-check" value="${x.id}" aria-label="${esc(x.name)} 선택"></td><td><div class="person"><span class="avatar">${esc(x.name[0])}</span>${esc(x.name)}</div></td><td>${esc(x.belt)}</td><td>${Number(x.rankLevel)>0?esc(String(x.rankLevel)+(x.rankKind==='단'?'단':'품')):'미취득'}</td><td>${x.gradeLevel?esc(String(x.gradeLevel)+'급'):'미입력'}</td><td>${esc(x.className)}</td><td>${percent(x)}%</td><td><span class="pill ${x.status==='재원'?'green':'red'}">${esc(x.status)}</span></td><td>${btn('수정',`openStudent(${x.id})`,'sm secondary')}${role==='owner'?btn('삭제',`confirmDeleteStudent(${x.id})`,'sm danger'):''}</td></tr>`).join('')}</tbody></table>${!list.length?'<div class="empty">검색 결과가 없습니다.</div>':''}`};function confirmDeleteStudent(id){
 if(role!=='owner'||!cloudReady)return;

function deleteStudentOwnerOnly(id){
 if(role!=='owner'||!cloudReady)return;
 const x=student(id);if(!x)return;
 if(!confirm('['+x.name+'] 관원과 관련 기록을 영구 삭제합니다. 계속하시겠습니까?'))return;
 db.students=db.students.filter(v=>v.id!==id);
 for(const month of Object.values(db.attendance||{}))if(month&&typeof month==='object')delete month[id];

 for(const key of ['promotionHistory','growthHistory','invites'])if(Array.isArray(db[key]))db[key]=db[key].filter(v=>Number(v.sid)!==id);
 save();closeModal();render();toast('관원이 삭제되었습니다.');

function stepStudentField(button,name,direction){
 const field=button.closest('.tkd-step-wrap').querySelector('[name="'+name+'"]');if(!field)return;
 const current=Number(field.value)||0;
 if(name==='gradeLevel')field.value=String(Math.max(1,Math.min(99,(current||1)-direction)));
 else field.value=String(Math.max(0,Math.min(9,current+direction)));
 field.dispatchEvent(new Event('change',{bubbles:true}));
}
function formatRank(x){return Number(x.rankLevel)>0?String(x.rankLevel)+(x.rankKind==='단'?'단':'품'):'미취득'}
function bulkNext(x,grade,rank,gradeDelta,rankDelta){
 const next={gradeLevel:x.gradeLevel,rankLevel:Number(x.rankLevel)||0,rankKind:x.rankKind||'품'};
 if(grade!=='keep')next.gradeLevel=grade==='clear'?'':Number(grade);
 if(rank!=='keep'){if(rank==='0'){next.rankLevel=0;next.rankKind='품'}else{const [n,k]=rank.split('-');next.rankLevel=Number(n);next.rankKind=k}}
 if(gradeDelta){const old=Number(next.gradeLevel);if(!old)return {error:'급수 미입력'};if(old-gradeDelta<1||old-gradeDelta>99)return {error:'급수 범위 초과'};next.gradeLevel=old-gradeDelta}
 if(rankDelta){const old=Number(next.rankLevel)||0;if(old+rankDelta<0||old+rankDelta>9)return {error:'품·단 범위 초과'};if(next.rankKind==='품'&&old+rankDelta>4)return {error:'4품 초과는 개별 확인 필요'};next.rankLevel=old+rankDelta}
 return next;
}
function adjustBulkStep(name,direction){const f=document.querySelector('#tkd-bulk-form');if(!f)return;const input=f.elements[name];input.value=String(Math.max(-9,Math.min(9,(Number(input.value)||0)+direction)));renderBulkPreview()}
function renderBulkPreview(){const f=document.querySelector('#tkd-bulk-form');if(!f)return;const ids=f.dataset.ids.split(',').map(Number),grade=f.elements.gradeLevel.value,rank=f.elements.rank.value,gd=Number(f.elements.gradeDelta.value),rd=Number(f.elements.rankDelta.value);
 const html=ids.map(id=>{const x=student(id);if(!x)return '';const next=bulkNext(x,grade,rank,gd,rd);return `<div class="notice"><div><b>${esc(x.name)}</b><p class="mini">${x.gradeLevel?x.gradeLevel+'급':'미입력'} / ${formatRank(x)} → ${next.error?'<b style="color:#dc2626">'+next.error+'</b>':(next.gradeLevel?next.gradeLevel+'급':'미입력')+' / '+formatRank(next)}</p></div></div>`}).join('');f.querySelector('#tkd-bulk-preview').innerHTML=html;
}

function dueDateFor(x,month){
 if(!x||!/^[0-9]{4}-[0-9]{2}$/.test(month||''))return '';
 let anchor=x.dueDate||'';
 if(!/^[0-9]{4}-[0-9]{2}-[0-9]{2}$/.test(anchor))return '';
 const changes=(Array.isArray(x.dueDateChanges)?x.dueDateChanges:[])
   .filter(c=>c&&/^[0-9]{4}-[0-9]{2}$/.test(c.month||'')&&c.month<=month&&/^[0-9]{4}-[0-9]{2}-[0-9]{2}$/.test(c.date||''))
   .sort((a,b)=>a.month.localeCompare(b.month));
 if(changes.length)anchor=changes[changes.length-1].date;
 const [year,mon]=month.split('-').map(Number);
 const day=Number(anchor.slice(8,10));
 const last=new Date(Date.UTC(year,mon,0)).getUTCDate();
 return month+'-'+String(Math.min(day,last)).padStart(2,'0');
}
function dueWithinSevenDays(value){if(!/^\d{4}-\d{2}-\d{2}$/.test(value||''))return false;const days=Math.round((Date.parse(value+'T00:00:00')-Date.parse(today()+'T00:00:00'))/86400000);return days>=0&&days<=7}
function updateDueDate(id,value){
 if(role!=='owner')return;
 const x=student(id);if(!x)return;
 if(value&&(!/^\d{4}-\d{2}-\d{2}$/.test(value)||value.slice(0,7)!==duesMonth||Number.isNaN(Date.parse(value+'T00:00:00')))){
  toast('조회 월에 해당하는 날짜를 선택해 주세요');render();return;
 }
 if(!x.dueDate){
  if(!value)return;
  x.dueDate=value;
 }else{
  x.dueDateChanges=Array.isArray(x.dueDateChanges)?x.dueDateChanges:[];
  x.dueDateChanges=x.dueDateChanges.filter(c=>c.month!==duesMonth);
  if(value)x.dueDateChanges.push({month:duesMonth,date:value});
  x.dueDateChanges.sort((a,b)=>a.month.localeCompare(b.month));
 }
 save();render();toast('납부예정일 저장 완료');
}

function plusMonths(ymd,months){if(!/^\d{4}-\d{2}-\d{2}$/.test(ymd||''))return '';const [y,m,d]=ymd.split('-').map(Number);const base=new Date(Date.UTC(y,m-1+months,1));const last=new Date(Date.UTC(base.getUTCFullYear(),base.getUTCMonth()+1,0)).getUTCDate();base.setUTCDate(Math.min(d,last));return base.toISOString().slice(0,10)}

function tkdParentMonthShift(delta){

 const [year,mon]=month.split('-').map(Number);
 const d=new Date(year,mon-1+delta,1);
 tkdParentAttendanceMonth=localDate(d).slice(0,7);
 render();
}
function tkdParentCalendar(x){
 const month=tkdParentAttendanceMonth||today().slice(0,7);
 const [year,mon]=month.split('-').map(Number);
 const first=new Date(year,mon-1,1).getDay();
 const days=new Date(year,mon,0).getDate();
 let present=0,absent=0;
 const cells=Array.from({length:first},()=>'<div class="tkd-parent-day tkd-parent-blank"></div>');
 for(let day=1;day<=days;day++){
  const key=month+'-'+String(day).padStart(2,'0');
  const status=attendanceStatus(key,x.id);
  if(status==='present')present++;
  if(status==='absent')absent++;
  const future=key>today();
  const mark=status==='present'?'✓':status==='absent'?'−':'';
  const title=status==='present'?'출석':status==='absent'?'결석':'미기록';
  cells.push(`<div class="tkd-parent-day ${status==='present'?'tkd-parent-present':status==='absent'?'tkd-parent-absent':''} ${future?'tkd-parent-future':''}" title="${esc(key+' · '+title)}"><span>${day}</span>${mark?`<b>${mark}</b>`:''}</div>`);
 }
 return `<div class="tkd-parent-monthbar"><button type="button" class="btn sm secondary" onclick="tkdParentMonthShift(-1)" aria-label="이전 달">‹</button><strong>${year}년 ${mon}월</strong><button type="button" class="btn sm secondary" onclick="tkdParentMonthShift(1)" aria-label="다음 달">›</button></div><div class="tkd-parent-calendar">${['일','월','화','수','목','금','토'].map(v=>`<div class="tkd-parent-week">${v}</div>`).join('')}${cells.join('')}</div><div class="tkd-parent-legend"><span>🟢 출석 ${present}회</span><span>⚪ 결석 ${absent}회</span><span>표시 없는 날은 미기록</span></div>`;
}

async function tkdRefreshApprovals(){

  const coachPending=snap.docs.map(d=>({id:d.id,...d.data()})).filter(x=>x.role==='coach'&&x.status==='pending');
  if(coachPending.length)host.innerHTML+=`<div style="margin-top:20px"><h3>사범 가입 승인 대기 (${coachPending.length})</h3>${coachPending.map(x=>`<div class="notice" style="margin-bottom:10px"><div><b>${esc(x.name)} · 사범</b><p>신청 코드: ${esc(x.inviteCode||'')}</p><div class="row">${btn('승인',`tkdApprove('${x.id}')`,'sm secondary')}${btn('반려',`tkdReject('${x.id}')`,'sm danger')}</div></div></div>`).join('')}</div>`;
 }catch(e){host.textContent='가입 신청 조회 실패: '+e.message;}
}
async function tkdApprove(uid){
 if(role!=='owner'||!cloudReady)return;
 const fs=firebase.firestore();
 try{
  const reqRef=fs.doc('registrationRequests/'+uid),req=await reqRef.get();
  if(!req.exists||req.data().status!=='pending')throw Error('승인 대기 신청이 아닙니다.');
  const a=req.data();
  const matches=await fs.collection('invitations').where('code','==',a.inviteCode).get();
  const invitation=matches.docs.find(d=>d.data().role===a.role&&!d.data().used&&d.data().expiresAt?.toMillis()>Date.now()&&(a.role!=='parent'||(Number(d.data().sid)>0&&d.data().childName===a.childName)));
  if(!invitation)throw Error('초대코드가 없거나 만료·사용 완료되었거나 자녀 이름이 일치하지 않습니다.');
  if(!confirm(`${a.name} (${a.role==='parent'?'학부모':'사범'}) 가입을 승인하시겠습니까?`))return;
  await fs.runTransaction(async tx=>{
   const [rr,ir]=await Promise.all([tx.get(reqRef),tx.get(invitation.ref)]);
   if(rr.data()?.status!=='pending'||ir.data()?.used||ir.data()?.expiresAt?.toMillis()<=Date.now())throw Error('신청 또는 초대코드 상태가 변경되었습니다.');
   tx.set(fs.doc('users/'+uid),{role:a.role,active:true,name:a.name,sid:a.role==='parent'?ir.data().sid:null,approvedAt:firebase.firestore.FieldValue.serverTimestamp()});
   tx.update(reqRef,{status:'approved',approvedAt:firebase.firestore.FieldValue.serverTimestamp()});
   tx.update(invitation.ref,{used:true,usedBy:uid});
  });
  await tkdPublishRoleViews();toast('가입 승인 완료');tkdRefreshApprovals();
 }catch(e){alert('승인 실패: '+e.message)}
}
